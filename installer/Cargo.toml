[package]
name = "statscraft-installer"
version = "0.2.0"
edition = "2021"
description = "Silent per-user installer for StatsCraft (single prebuilt exe, no extraction UI)"

# Isolate from the parent project's package
[workspace]

[[bin]]
name = "StatsCraftSetup"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = false

# The icon for the installer executable, and the version information
# Windows shows in the file's properties.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
