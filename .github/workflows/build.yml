name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app (release)
        run: cargo build --release

      - name: Build silent installer (embeds app exe)
        run: |
          cd installer
          cargo build --release

      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatsCraftSetup-windows
          path: installer/target/release/StatsCraftSetup.exe

      - name: Publish portable exe
        uses: actions/upload-artifact@v4
        with:
          name: statscraft-portable-windows
          path: target/release/statscraft.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev fontconfig

      - name: Run tests
        run: cargo test

      - name: Check the .deb control file
        run: |
          # The control file has to carry a version dpkg will accept.
          # This check catches a bad version before the package build
          # does, because dpkg's own error message is not obvious.
          sed -e 's/@VERSION@/0.0.0/' -e 's/@ARCH@/amd64/' \
            packaging/linux/control > /tmp/control
          mkdir -p /tmp/pkg/DEBIAN
          cp /tmp/control /tmp/pkg/DEBIAN/control
          dpkg-deb --build /tmp/pkg /tmp/check.deb
          rm -rf /tmp/pkg /tmp/check.deb /tmp/control

      - name: Build .deb package
        run: bash packaging/linux/build_deb.sh

      - name: Publish .deb
        uses: actions/upload-artifact@v4
        with:
          name: statscraft-deb
          path: statscraft_*.deb

      - name: Publish portable binary
        uses: actions/upload-artifact@v4
        with:
          name: statscraft-portable-linux
          path: target/release/statscraft
