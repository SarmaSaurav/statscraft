[package]
name = "statscraft"
version = "0.1.0"
edition = "2021"
description = "Lightweight SPSS-like statistical analysis workstation (Rust)"
license = "MIT"

[dependencies]
# UI (native, immediate-mode)
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"
rfd = "0.17"

# Data + compute
csv = "1.3"
libloading = "0.8"
statrs = "0.17"
polars = { version = "0.53", features = ["csv"] }
polars-readstat-rs = "0.21"
egui_extras = { version = "0.29", features = ["image", "svg"] }

# The system clipboard, for copying and pasting cells in the Data
# Editor. egui can write the clipboard but not read it.
arboard = "3.7"

# Parsing / scripting
# pest = "2.7"
# pest_derive = "2.7"
# mlua = { version = "0.9", features = ["lua54", "vendored"] }

# Serialization / errors
# serde = { version = "1.0", features = ["derive"] }
# serde_json = "1.0"
# thiserror = "2.0"
# anyhow = "1.0"

# Optional .sav I/O via FFI to IBM SPSS I/O (spssio64.dll)
# (no crate; hand-rolled FFI in src/io/sav_ffi.rs)

[[bin]]
name = "statscraft"
path = "src/main.rs"

# The icon for the executable, and the version information Windows
# shows in the file's properties.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
